<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestons Pharmacy — Staff Guide Hub</title>
<style>
  :root {
    --teal-50: #e1f5ee; --teal-100: #9fe1cb; --teal-200: #5dcaa5;
    --teal-600: #0f6e56; --teal-800: #085041;
    --gray-50: #f7f7f5; --gray-100: #efefeb; --gray-200: #d3d1c7;
    --gray-500: #888780; --gray-700: #5f5e5a; --gray-900: #2c2c2a;
    --amber-50: #faeeda; --amber-100: #fac775;
    --amber-600: #854f0b; --amber-800: #633806;
    --radius-sm: 6px; --radius-md: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--gray-50); color: var(--gray-900); line-height: 1.6; font-size: 15px; }
  header { background: var(--teal-600); color: #fff; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .logo-pill { background: rgba(255,255,255,0.18); border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 500; }
  .header-search { display: flex; align-items: center; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: var(--radius-sm); padding: 0 10px; gap: 6px; height: 34px; min-width: 220px; }
  .header-search input { background: none; border: none; outline: none; color: #fff; font-size: 13px; width: 100%; }
  .header-search input::placeholder { color: rgba(255,255,255,0.6); }
  .app { display: flex; min-height: calc(100vh - 56px); }
  aside { width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--gray-200); padding: 1.5rem 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
  .sidebar-section { margin-bottom: 1.5rem; }
  .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-500); padding: 0 1.25rem; margin-bottom: 4px; }
  .sidebar-item { display: flex; align-items: center; gap: 8px; padding: 7px 1.25rem; font-size: 13.5px; color: var(--gray-700); cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s; text-decoration: none; }
  .sidebar-item:hover { background: var(--gray-50); color: var(--gray-900); }
  .sidebar-item.active { background: var(--teal-50); color: var(--teal-600); border-left-color: var(--teal-600); font-weight: 500; }
  .sidebar-count { margin-left: auto; background: var(--gray-100); color: var(--gray-500); font-size: 11px; border-radius: 10px; padding: 1px 7px; }
  main { flex: 1; padding: 2rem 2.5rem; max-width: 900px; }
  .view { display: none; }
  .view.active { display: block; }
  .page-heading { font-size: 22px; font-weight: 600; color: var(--gray-900); margin-bottom: 4px; }
  .page-sub { font-size: 13.5px; color: var(--gray-500); margin-bottom: 1.75rem; }
  .guide-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 1.1rem 1.25rem; margin-bottom: 10px; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .guide-card:hover { border-color: var(--teal-200); box-shadow: 0 2px 8px rgba(15,110,86,0.07); }
  .guide-icon { width: 38px; height: 38px; border-radius: var(--radius-sm); background: var(--teal-50); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
  .guide-meta { flex: 1; }
  .guide-title { font-size: 14.5px; font-weight: 500; color: var(--gray-900); margin-bottom: 2px; }
  .guide-desc { font-size: 12.5px; color: var(--gray-500); }
  .guide-arrow { color: var(--gray-200); font-size: 18px; }
  .guide-card:hover .guide-arrow { color: var(--teal-600); }
  .badge { font-size: 11px; font-weight: 500; border-radius: 20px; padding: 2px 9px; }
  .badge-teal { background: var(--teal-50); color: var(--teal-600); }
  .badge-purple { background: #f0eeff; color: #5b21b6; }
  .guide-nav { font-size: 12.5px; margin-bottom: 1.5rem; }
  .guide-nav a { color: var(--teal-600); cursor: pointer; text-decoration: none; }
  .guide-nav a:hover { text-decoration: underline; }
  .guide-detail-header { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--gray-100); }
  .guide-detail-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .guide-detail-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .guide-detail-meta span { font-size: 12.5px; color: var(--gray-500); }
  .warning-box { background: var(--amber-50); border: 1px solid var(--amber-100); border-left: 3px solid var(--amber-600); border-radius: var(--radius-sm); padding: 0.9rem 1.1rem; margin-bottom: 1.5rem; font-size: 13.5px; color: var(--amber-800); line-height: 1.55; }
  .warning-box strong { display: block; font-weight: 600; margin-bottom: 3px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--amber-600); }
  .info-box { background: #f0f9f5; border: 1px solid var(--teal-100); border-left: 3px solid var(--teal-200); border-radius: var(--radius-sm); padding: 0.9rem 1.1rem; margin-bottom: 1.5rem; font-size: 13.5px; color: var(--teal-800); line-height: 1.55; }
  .info-box strong { display: block; font-weight: 600; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--teal-600); }
  .info-box ul { margin: 6px 0 0 1.1rem; display: flex; flex-direction: column; gap: 3px; }
  .steps-label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--gray-500); margin-bottom: 1rem; }
  .step { display: flex; gap: 1rem; margin-bottom: 1.25rem; align-items: flex-start; }
  .step-num { width: 26px; height: 26px; border-radius: 50%; background: var(--teal-600); color: #fff; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .step-body { flex: 1; background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); padding: 0.75rem 1rem; }
  .step-body p { font-size: 14px; color: var(--gray-900); line-height: 1.55; }
  .step-body .step-detail { margin-top: 6px; font-size: 12.5px; color: var(--gray-500); }
  .step-screenshot { margin-top: 10px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); overflow: hidden; }
  .step-screenshot img { width: 100%; display: block; }
  code { background: var(--gray-100); color: var(--gray-700); border-radius: 4px; padding: 1px 5px; font-family: monospace; font-size: 12px; }
  /* Status table styles */
  .reference-intro { font-size: 14px; color: var(--gray-700); margin-bottom: 1.25rem; line-height: 1.6; }
  .status-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 1.5rem; font-size: 13.5px; }
  .status-table th { background: var(--teal-600); color: #fff; padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .status-table td { padding: 10px 14px; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
  .status-table tr:last-child td { border-bottom: none; }
  .status-table tr:hover td { background: var(--gray-50); }
  .status-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; letter-spacing: 0.03em; }
  .tag-new { background: #dbeafe; color: #1e40af; }
  .tag-pv1 { background: #ede9fe; color: #5b21b6; }
  .tag-outbound { background: #fef3c7; color: #92400e; }
  .tag-complete { background: #d1fae5; color: #065f46; }
  .tag-order { background: #f0f9f5; color: var(--teal-800); }
  .action-needed { font-weight: 500; color: var(--gray-900); }
  .action-detail { font-size: 12px; color: var(--gray-500); margin-top: 2px; }
  .ref-screenshot { border: 1px solid var(--gray-200); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 1.5rem; }
  .ref-screenshot img { width: 100%; display: block; }
  .empty-state { background: #fff; border: 1px dashed var(--gray-200); border-radius: var(--radius-md); padding: 2.5rem; text-align: center; color: var(--gray-500); font-size: 13.5px; margin-top: 1rem; }
  .no-results { text-align: center; padding: 2rem; color: var(--gray-500); font-size: 13.5px; }
  @media (max-width: 700px) { aside { display: none; } main { padding: 1.25rem; } .header-search { min-width: 140px; } .status-table { font-size: 12px; } }
</style>
</head>
<body>
<header>
  <div class="logo">Prestons Pharmacy <span class="logo-pill">Staff Hub</span></div>
  <div class="header-search">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search guides..." oninput="handleSearch(this.value)" />
  </div>
</header>
<div class="app">
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">Browse</div>
      <a class="sidebar-item active" onclick="showCategory('all')" id="cat-all">All guides <span class="sidebar-count" id="count-all">0</span></a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Categories</div>
      <a class="sidebar-item" onclick="showCategory('inventory')" id="cat-inventory">📦 Inventory <span class="sidebar-count" id="count-inventory">0</span></a>
      <a class="sidebar-item" onclick="showCategory('orders')" id="cat-orders">📋 Orders <span class="sidebar-count" id="count-orders">0</span></a>
      <a class="sidebar-item" onclick="showCategory('patients')" id="cat-patients">🧑 Patients <span class="sidebar-count" id="count-patients">0</span></a>
      <a class="sidebar-item" onclick="showCategory('reference')" id="cat-reference">📖 Reference <span class="sidebar-count" id="count-reference">0</span></a>
      <a class="sidebar-item" onclick="showCategory('system')" id="cat-system">⚙️ System <span class="sidebar-count" id="count-system">0</span></a>
    </div>
  </aside>
  <main>
    <div id="view-list" class="view active">
      <h1 class="page-heading" id="listHeading">All guides</h1>
      <p class="page-sub" id="listSub">Step-by-step instructions for common LIFE FILE tasks and pharmacy workflows.</p>
      <div id="guideList"></div>
      <div id="noResults" class="no-results" style="display:none;">No guides found.</div>
      <div id="emptyCategory" style="display:none;"><div class="empty-state">No guides in this category yet.</div></div>
    </div>
    <div id="view-detail" class="view">
      <div id="detailContent"></div>
    </div>
  </main>
</div>

var imgMap = { IMG1: IMG1, IMG2: IMG2, IMG3: IMG3, IMG4: IMG4, IMG6: IMG6 };
var currentCategory = "all";
var currentSearch = "";

function renderList() {
  var list = document.getElementById("guideList");
  var noResults = document.getElementById("noResults");
  var emptyCategory = document.getElementById("emptyCategory");
  var filtered = guides.filter(function(g) {
    var matchCat = currentCategory === "all" || g.category === currentCategory;
    var matchSearch = !currentSearch || g.title.toLowerCase().indexOf(currentSearch.toLowerCase()) > -1 || g.desc.toLowerCase().indexOf(currentSearch.toLowerCase()) > -1;
    return matchCat && matchSearch;
  });
  list.innerHTML = "";
  if (filtered.length === 0 && currentSearch) { noResults.style.display = "block"; emptyCategory.style.display = "none"; return; }
  noResults.style.display = "none";
  if (filtered.length === 0) { emptyCategory.style.display = "block"; return; }
  emptyCategory.style.display = "none";
  filtered.forEach(function(g) {
    var card = document.createElement("div");
    card.className = "guide-card";
    card.onclick = function() { showGuide(g.id); };
    var badgeClass = g.type === "reference" ? "badge-purple" : "badge-teal";
    var badgeLabel = g.type === "reference" ? "Reference" : g.steps.length + " steps";
    card.innerHTML = '<div class="guide-icon">' + g.icon + '</div><div class="guide-meta"><div class="guide-title">' + g.title + '</div><div class="guide-desc">' + g.desc + '</div></div><span class="badge ' + badgeClass + '">' + badgeLabel + '</span><span class="guide-arrow">›</span>';
    list.appendChild(card);
  });
}

function showCategory(cat) {
  currentCategory = cat; currentSearch = "";
  document.getElementById("searchInput").value = "";
  var items = document.querySelectorAll(".sidebar-item");
  for (var i = 0; i < items.length; i++) items[i].classList.remove("active");
  document.getElementById("cat-" + cat).classList.add("active");
  var labels = {
    all: ["All guides", "Step-by-step instructions for common LIFE FILE tasks and pharmacy workflows."],
    inventory: ["Inventory", "Managing lot counts, adjustments, and stock in LIFE FILE."],
    orders: ["Orders", "Processing and managing pharmacy orders."],
    patients: ["Patient management", "Guides for patient records and profiles."],
    reference: ["Reference", "Quick-lookup guides for statuses, codes, and LIFE FILE terminology."],
    system: ["System & settings", "Configuration and system-level workflows."]
  };
  document.getElementById("listHeading").textContent = labels[cat][0];
  document.getElementById("listSub").textContent = labels[cat][1];
  showView("list"); renderList();
}

function handleSearch(val) {
  currentSearch = val; currentCategory = "all";
  var items = document.querySelectorAll(".sidebar-item");
  for (var i = 0; i < items.length; i++) items[i].classList.remove("active");
  document.getElementById("cat-all").classList.add("active");
  showView("list"); renderList();
}

function showGuide(id) {
  var guide = null;
  for (var i = 0; i < guides.length; i++) { if (guides[i].id === id) { guide = guides[i]; break; } }
  if (!guide) return;

  if (guide.type === "reference") {
    showReferenceGuide(guide);
    return;
  }

  var stepsHtml = "";
  for (var i = 0; i < guide.steps.length; i++) {
    var s = guide.steps[i];
    var imgHtml = s.img ? '<div class="step-screenshot"><img src="' + imgMap[s.img] + '" alt="Step ' + (i+1) + ' screenshot" /></div>' : '';
    stepsHtml += '<div class="step"><div class="step-num">' + (i+1) + '</div><div class="step-body"><p>' + s.text + '</p>' + (s.detail ? '<p class="step-detail">' + s.detail + '</p>' : '') + imgHtml + '</div></div>';
  }
  var warningHtml = guide.warning ? '<div class="warning-box"><strong>⚠ ' + guide.warning.heading + '</strong>' + guide.warning.body + '</div>' : '';
  var infoHtml = guide.info ? '<div class="info-box"><strong>' + guide.info.heading + '</strong><ul>' + guide.info.items.map(function(item) { return '<li>' + item + '</li>'; }).join("") + '</ul></div>' : '';
  document.getElementById("detailContent").innerHTML =
    '<div class="guide-nav"><a onclick="showCategory(\'' + guide.category + '\')">← Back</a></div>' +
    '<div class="guide-detail-header"><h1 class="guide-detail-title">' + guide.icon + ' ' + guide.title + '</h1><div class="guide-detail-meta"><span class="badge badge-teal">📦 ' + guide.category.charAt(0).toUpperCase() + guide.category.slice(1) + '</span><span>' + guide.steps.length + ' steps</span><span>LIFE FILE</span></div></div>' +
    warningHtml + '<div class="steps-label">Steps</div>' + stepsHtml + infoHtml;
  showView("detail");
}

function showReferenceGuide(guide) {
  var statuses = [
    { s1: "NEW", s1tag: "tag-new", s2: "NEW", s2tag: "tag-new", action: "Rx has been scanned in. Needs to be typed by data entry.", detail: "" },
    { s1: "PV1", s1tag: "tag-pv1", s2: "READY FOR PV1", s2tag: "tag-pv1", action: "Rx has been typed. Pharmacist must PV1.", detail: "" },
    { s1: "OUTBOUND #1/2/3", s1tag: "tag-outbound", s2: "PV1", s2tag: "tag-pv1", action: "Rx has been PV1'd. Needs to be scheduled.", detail: "" },
    { s1: "COMPLETE PROCESSING", s1tag: "tag-complete", s2: "PENDING COMPOUNDING", s2tag: "tag-complete", action: "Rx is in Lot Management. Compounders can make the medication. Cross-verify if unsure.", detail: "" },
    { s1: "COMPLETE PROCESSING", s1tag: "tag-complete", s2: "READY FOR FULFILLMENT", s2tag: "tag-complete", action: "Rx can be printed from the Fulfillment queue.", detail: "" },
    { s1: "COMPLETE PROCESSING", s1tag: "tag-complete", s2: "FULFILLMENT", s2tag: "tag-complete", action: "Label printed. Needs to be filled — or may already be filled and awaiting pharmacist check.", detail: "" },
    { s1: "COMPLETE PROCESSING", s1tag: "tag-complete", s2: "FINAL VERIFICATION", s2tag: "tag-complete", action: "Rx checked by pharmacist.", detail: "" },
    { s1: "COMPLETE PROCESSING", s1tag: "tag-complete", s2: "RX ENTERED WILL CALL PICK UP", s2tag: "tag-complete", action: "Rx verified and set for pick-up queue. Complete via patient pick-up kiosk.", detail: "" },
    { s1: "COMPLETE ORDER", s1tag: "tag-order", s2: "COMPLETE SHIPPING/PICK UP", s2tag: "tag-order", action: "Rx fully completed via pick-up kiosk or shipping stage.", detail: "" }
  ];

  var rows = statuses.map(function(s) {
    return '<tr><td><span class="status-tag ' + s.s1tag + '">' + s.s1 + '</span></td><td><span class="status-tag ' + s.s2tag + '">' + s.s2 + '</span></td><td><div class="action-needed">' + s.action + '</div><div class="action-detail">' + s.detail + '</div></td></tr>';
  }).join("");

  document.getElementById("detailContent").innerHTML =
    '<div class="guide-nav"><a onclick="showCategory(\'reference\')">← Back</a></div>' +
    '<div class="guide-detail-header"><h1 class="guide-detail-title">' + guide.icon + ' ' + guide.title + '</h1><div class="guide-detail-meta"><span class="badge badge-purple">📖 Reference</span><span>LIFE FILE</span></div></div>' +
    '<p class="reference-intro">Understanding statuses is critical for tracking where a prescription is in the workflow. The <strong>Rx Workflow</strong> column shows the <strong>last completed stage</strong>, not the current stage. The next step to complete is always one step ahead.<br><br>For example, if the Rx Workflow status = <strong>FULFILLMENT</strong>, the Rx is currently sitting in the Final Verification queue waiting to be checked.</p>' +
    '<div class="ref-screenshot"><img src="' + IMG_QUEUE + '" alt="LIFE FILE order queue screenshot" /></div>' +
    '<table class="status-table"><thead><tr><th>Rx Workflow</th><th>Order Workflow</th><th>What it means / Action needed</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="info-box"><strong>Common confusion</strong><ul><li><strong>Ready for Fulfillment</strong> = label has NOT been printed yet — go print it</li><li><strong>Fulfillment</strong> = label already printed — Rx needs to be physically filled</li></ul></div>';

  showView("detail");
}

function showView(name) {
  var views = document.querySelectorAll(".view");
  for (var i = 0; i < views.length; i++) views[i].classList.remove("active");
  document.getElementById("view-" + name).classList.add("active");
}

function updateCounts() {
  var cats = ["inventory", "orders", "patients", "reference", "system"];
  document.getElementById("count-all").textContent = guides.length;
  cats.forEach(function(c) { document.getElementById("count-" + c).textContent = guides.filter(function(g) { return g.category === c; }).length; });
}

updateCounts();
renderList();
</script>
</body>
</html>
